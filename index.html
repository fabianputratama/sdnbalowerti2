<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SDN Balowerti 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-green-50 via-teal-50 to-emerald-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-emerald-100 transition-all transform hover:scale-[1.01]">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-200">
                <i class="fa-solid fa-school text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">SDN Balowerti 2</h1>
            <p class="text-sm text-gray-500 mt-1">Sistem Pengaduan & Pelayanan Online</p>
        </div>

        <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
            <button id="tabUser" onclick="switchTab('user')" class="w-1/2 py-2.5 text-sm font-medium rounded-lg bg-white text-emerald-700 shadow-sm transition-all">
                <i class="fa-solid fa-user-graduate mr-2"></i>Siswa / Ortu
            </button>
            <button id="tabAdmin" onclick="switchTab('admin')" class="w-1/2 py-2.5 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all">
                <i class="fa-solid fa-user-shield mr-2"></i>Admin Sekolah
            </button>
        </div>

        <form id="formUser" onsubmit="loginUser(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Wali Murid / Siswa</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="userEmailInput" required class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" placeholder="contoh: budi@gmail.com">
                </div>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2">
                Masuk Layanan <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </form>

        <form id="formAdmin" onsubmit="loginAdmin(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ID Admin</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-id-card"></i>
                    </span>
                    <input type="text" id="adminID" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" placeholder="ID Admin">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Kata Sandi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="adminPass" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all" placeholder="••••••••">
                </div>
            </div>
            <div id="errorMsg" class="text-red-500 text-xs hidden font-medium"><i class="fa-solid fa-circle-exclamation mr-1"></i> ID atau Password salah!</div>
            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                Konfirmasi Admin <i class="fa-solid fa-lock-open text-sm"></i>
            </button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const tUser = document.getElementById('tabUser');
            const tAdmin = document.getElementById('tabAdmin');
            const fUser = document.getElementById('formUser');
            const fAdmin = document.getElementById('formAdmin');

            if(tab === 'user') {
                tUser.className = "w-1/2 py-2.5 text-sm font-medium rounded-lg bg-white text-emerald-700 shadow-sm transition-all";
                tAdmin.className = "w-1/2 py-2.5 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all";
                fUser.classList.remove('hidden');
                fAdmin.classList.add('hidden');
            } else {
                tAdmin.className = "w-1/2 py-2.5 text-sm font-medium rounded-lg bg-white text-slate-800 shadow-sm transition-all";
                tUser.className = "w-1/2 py-2.5 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all";
                fAdmin.classList.remove('hidden');
                fUser.classList.add('hidden');
            }
        }

        function loginUser(e) {
            e.preventDefault();
            const email = document.getElementById('userEmailInput').value.trim().toLowerCase();
            localStorage.setItem('currentUserEmail', email);
            
            // Daftarkan email ke indeks pencarian admin
            let userList = JSON.parse(localStorage.getItem('registered_users') || '[]');
            if(!userList.includes(email)) {
                userList.push(email);
                localStorage.setItem('registered_users', JSON.stringify(userList));
            }
            window.location.href = 'user.html';
        }

        function loginAdmin(e) {
            e.preventDefault();
            if(document.getElementById('adminID').value === 'sdnbalowerti2' && document.getElementById('adminPass').value === 'baldamengaji15') {
                localStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
