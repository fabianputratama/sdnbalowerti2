<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kontrol Admin - SDN Balowerti 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .wa-bg { background-color: #efeae2; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-slate-950 p-2 rounded-xl font-bold"><i class="fa-solid fa-user-shield"></i></div>
            <div>
                <h1 class="font-bold text-md leading-tight">Admin Live Chat Platform</h1>
                <p class="text-xs text-slate-400">Monitoring Konseling Berbasis Email User Terpadu</p>
            </div>
        </div>
        <a href="index.html" onclick="localStorage.removeItem('isAdmin')" class="bg-slate-800 hover:bg-red-700 px-4 py-2 rounded-xl text-xs font-semibold transition-all">Log Out</a>
    </header>

    <main class="max-w-7xl mx-auto w-full p-6 flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[550px]">
            <div class="p-4 bg-slate-50 border-b border-slate-200 font-bold text-sm text-slate-700">
                <i class="fa-solid fa-list mr-1"></i> Daftar Sesi Obrolan Wali Murid
            </div>
            <div id="userListContainer" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                </div>
        </div>

        <div class="lg:col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[550px]">
            <div class="p-4 bg-slate-800 text-white font-bold text-sm flex justify-between items-center">
                <span><i class="fa-solid fa-comments text-emerald-400 mr-1"></i> Ruang Percakapan: <span id="activeChatTarget" class="text-amber-400 text-xs">Pilih User</span></span>
            </div>
            <div id="adminChatBox" class="flex-1 wa-bg p-4 overflow-y-auto space-y-2 flex flex-col">
                <p class="text-center text-xs text-gray-400 my-auto">Silakan pilih salah satu email di sebelah kiri untuk meninjau obrolan atau mengirim balasan manual.</p>
            </div>
            <form id="adminReplyForm" onsubmit="sendAdminMessage(event)" class="p-2 bg-slate-100 border-t border-slate-200 flex gap-2 hidden">
                <input type="text" id="adminInput" required class="flex-1 px-3 py-2 bg-white border rounded-xl text-xs outline-none" placeholder="Ketik balasan manual resmi...">
                <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-semibold">Kirim</button>
            </form>
        </div>

        <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-file-excel text-green-600"></i> Rekap Dokumen Excel</h2>
                <button onclick="exportSurveys()" class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-3 px-4 rounded-xl text-xs shadow-md mb-2 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> Unduh Hasil Survey (.csv)
                </button>
                <button onclick="localStorage.clear(); location.reload();" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2 px-4 rounded-xl text-[10px] transition-all">
                    <i class="fa-solid fa-triangle-exclamation"></i> Reset Seluruh Database Browser
                </button>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-[300px] flex flex-col">
                <h2 class="text-base font-bold text-slate-800 mb-3"><i class="fa-solid fa-star text-amber-500"></i> Log Masukan Survey</h2>
                <div id="surveyLog" class="flex-1 overflow-y-auto space-y-2 text-xs"></div>
            </div>
        </div>
    </main>

    <script>
        if(localStorage.getItem('isAdmin') !== 'true') { window.location.href = 'index.html'; }

        let currentActiveEmail = "";

        function loadAdminDashboard() {
            // 1. Tampilkan List User
            const users = JSON.parse(localStorage.getItem('registered_users') || '[]');
            const alerts = JSON.parse(localStorage.getItem('admin_alerts') || '{}');
            const listContainer = document.getElementById('userListContainer');
            listContainer.innerHTML = users.length === 0 ? '<p class="text-center text-gray-400 text-xs p-6">Belum ada user login.</p>' : '';

            users.forEach(email => {
                const item = document.createElement('div');
                const hasAlert = alerts[email] ? '<span class="bg-rose-500 text-white text-[9px] px-1.5 py-0.5 rounded-full animate-bounce">Perlu Jawaban</span>' : '';
                item.className = `p-3 hover:bg-slate-50 cursor-pointer flex justify-between items-center transition-all ${currentActiveEmail === email ? 'bg-emerald-50 border-l-4 border-emerald-500' : ''}`;
                item.onclick = () => selectUserChat(email);
                item.innerHTML = `<div><p class="text-xs font-semibold text-slate-700">${email}</p></div> ${hasAlert}`;
                listContainer.appendChild(item);
            });

            // 2. Tampilkan Log Survey
            const surveys = JSON.parse(localStorage.getItem('surveys') || '[]');
            const logContainer = document.getElementById('surveyLog');
            logContainer.innerHTML = surveys.length === 0 ? '<p class="text-gray-400 text-center py-6">Belum ada survey.</p>' : '';
            surveys.reverse().forEach(s => {
                const d = document.createElement('div');
                d.className = "p-2 bg-slate-50 border rounded-lg text-[11px]";
                d.innerHTML = `<strong>${s.email}</strong> (${s.rating}) <p class="text-slate-500 italic">"${s.comment}"</p>`;
                logContainer.appendChild(d);
            });
        }

        function selectUserChat(email) {
            currentActiveEmail = email;
            document.getElementById('activeChatTarget').innerText = email;
            document.getElementById('adminReplyForm').classList.remove('hidden');
            
            // Hilangkan tanda "Perlu Jawaban" setelah dibaca admin
            let alerts = JSON.parse(localStorage.getItem('admin_alerts') || '{}');
            delete alerts[email];
            localStorage.setItem('admin_alerts', JSON.stringify(alerts));

            renderChatStream();
            loadAdminDashboard();
        }

        function renderChatStream() {
            const chatBox = document.getElementById('adminChatBox');
            chatBox.innerHTML = "";
            const history = JSON.parse(localStorage.getItem('chats_' + currentActiveEmail) || '[]');

            history.forEach(chat => {
                const b = document.createElement('div');
                if(chat.sender === 'user') {
                    b.className = "bg-white text-gray-800 rounded-xl rounded-tl-none p-2 max-w-[85%] self-start shadow-sm text-xs";
                    b.innerHTML = `<p class="font-bold text-emerald-800 text-[9px] mb-0.5">${chat.name}</p><p>${chat.text}</p>`;
                } else {
                    b.className = "bg-[#d9fdd3] text-gray-800 rounded-xl rounded-tr-none p-2 max-w-[85%] self-end shadow-sm text-xs";
                    b.innerHTML = `<p class="font-bold text-blue-700 text-[9px] mb-0.5">${chat.name}</p><p>${chat.text}</p>`;
                }
                chatBox.appendChild(b);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendAdminMessage(e) {
            e.preventDefault();
            const input = document.getElementById('adminInput');
            const val = input.value.trim();
            if(!val || !currentActiveEmail) return;

            let history = JSON.parse(localStorage.getItem('chats_' + currentActiveEmail) || '[]');
            history.push({ text: val, sender: 'bot', name: 'Admin Guru' });
            localStorage.setItem('chats_' + currentActiveEmail, JSON.stringify(history));

            input.value = '';
            renderChatStream();
        }

        function exportSurveys() {
            const data = JSON.parse(localStorage.getItem('surveys') || '[]');
            if(data.length === 0) return alert('Data kosong!');
            let csv = "data:text/csv;charset=utf-8,Email,Rating,Komentar,Tanggal\r\n";
            data.forEach(r => { csv += `"${r.email}","${r.rating}","${r.comment}","${r.date}"\r\n`; });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", "Rekap_Survey_SDN_Balowerti2.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        window.onload = loadAdminDashboard;
    </script>
</body>
</html>
